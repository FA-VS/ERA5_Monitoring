name: ERA5 drift monitor

on:
  schedule:
    - cron: '0 3 1 * *'          # monthly: run the monitor on a regular basis
  workflow_dispatch:             # manual trigger, with changeable inputs
    inputs:
      reference_years:
        default: '1950s'
      drift_threshold:
        default: '1.0'
      recent_year:
        default: '2025'

jobs:
  # ── Run the monitor ────────────────────────────────────────────────
  monitor:
    runs-on: ubuntu-latest
    permissions:
      id-token: write           # Needed for AWS??
      contents: read
      packages: read             # needed to pull from GHCR
    steps:
      - uses: ./.github/actions/setup-env # Pulls docker image, git code, AWS credentials

      - name: Run drift monitor
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          docker run \
            -e CDSAPI_URL -e CDSAPI_KEY \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_REGION -e AWS_DEFAULT_REGION \
            -e MLFLOW_TRACKING_URI \
            -v "${{ github.workspace }}/data:/app/data" \
            ${{ env.IMAGE }} \
            scripts.monitor \
            --fetch \
            --recent-year "${{ github.event.inputs.recent_year || '1985' }}" \
            --reference-glob 'data/reference/*.nc' \
            --reference-years "${{ github.event.inputs.reference_years || '1980s' }}" \
            --drift-threshold "${{ github.event.inputs.drift_threshold || '1.0' }}"
