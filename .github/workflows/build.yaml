name: Build and test docker image

on:
  push:
    tags: ['v*']
      #branches: [main]
      #    paths:                       # rebuild only when code or reference data changes
      #      - '**.py'
      #      - '.github/actions/*/*.yaml'
      #      - '.github/workflows/*.yaml'
      #      - 'requirements.txt'
      #      - 'dockerfile'
  workflow_dispatch:             # manual trigger (if needed)


jobs:
  # ── Build & push the image, but only on code/data changes ──────────
  build:
    # TODO: Clean-up / version images, so they don't pile up in github's registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # needed to push to GHCR
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic, no setup needed


      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha    # layer caching -> only rebuild what is necessary (i.e. faster rebuilds)
          cache-to: type=gha,mode=max

  # ── Tests ──────────────────────────────────────────────────────────
  era5tests:
    needs: build
    strategy:
      fail-fast: false # if one tests fails, the others still try to complete
      matrix:
        module: [tests.download_era5_1year, tests.run_linear_regression, tests.mlflow_read_write]
    runs-on: ubuntu-latest
    permissions:
      id-token: write           # Needed to create AWS token
      contents: read
      packages: read             # needed to pull from GHCR
    steps:
      - uses: actions/checkout@v4 # puts repo files on the runner (including reference cds data), to be mounted
      - uses: ./.github/actions/setup-env # Pulls docker image, loads AWS credentials
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run test
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          docker run \
          -e CDSAPI_URL -e CDSAPI_KEY \
          -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
          -e AWS_REGION -e AWS_DEFAULT_REGION \
          -e MLFLOW_TRACKING_URI \
          -v "${{ github.workspace }}/data:/app/data" \
          ${{ env.IMAGE }} \
          ${{ matrix.module }}
